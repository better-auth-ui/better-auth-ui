name: autofix.ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install

      # Oxlint's typeCheck resolves the workspace packages through their
      # built declarations.
      - run: bun nx run-many -t build --projects 'packages/*'
      - run: bun nx run-many -t registry:build -p start-shadcn-example start-solid-zaidan-example
      - run: bunx tsr generate
        working-directory: apps/docs

      - run: bunx oxlint --fix
      - run: bunx oxfmt

      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27 # v1.3.2
