name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://foo@bar"
  NX_PARALLEL: "1"

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      # nx-set-shas reads workflow runs to find the last successful commit.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: bunx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - run: bun install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Cache Playwright browsers for Vitest browser testing
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(bun run playwright --version | sed 's/^Version //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # System deps are not installed on cache hit: ubuntu-latest runners
      # already ship the libraries headless Chromium needs. If browser tests
      # start failing with missing shared library errors, restore an
      # "install-deps" step here.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps chromium

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: bun nx-cloud record -- echo Hello World

      # Check code formatting and linting
      - run: bun nx run workspace:lint

      # Run tests, build, and typecheck affected projects
      - run: bun nx affected -t build typecheck test

      # Ensure all publishable packages are built (cache hits when unaffected)
      - run: bun nx run-many -t build --projects 'packages/*'

      - name: Validate published declaration consumers
        run: bun nx run workspace:declarations-check

      - name: Validate agent skills and package contents
        run: bun nx run workspace:skills-check

      # Publish new versions of the packages
      - run: bun nx-cloud record -- bunx pkg-pr-new publish --packageManager=bun './packages/*'

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: bun nx fix-ci
        if: always()
