name: Publish Packages

on:
  workflow_call:
    inputs:
      ref:
        description: Commit containing the package versions to publish
        required: true
        type: string

jobs:
  publish:
    if: github.repository == 'better-auth-ui/better-auth-ui'
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
          ref: ${{ inputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Print Environment Info
        run: bun nx report

      - name: Build packages
        run: bun nx run-many -t build --projects='packages/*'

      - name: Publish packages
        run: rm -f bun.lock bun.lockb && npx nx release publish
