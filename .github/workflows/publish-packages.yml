name: Publish Packages

on:
  workflow_call:
    inputs:
      ref:
        description: Commit containing the package versions to publish
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.repository == 'better-auth-ui/better-auth-ui'
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Print Environment Info
        run: bun nx report

      - name: Build packages
        run: bun nx run-many -t build --projects='packages/*'

      - name: Sync npm package READMEs
        run: |
          for package_json in packages/*/package.json; do
            cp README.md "$(dirname "$package_json")/README.md"
          done

      - name: Validate agent skills and package contents
        run: bun nx run workspace:skills-check

      - name: Publish packages
        run: rm -f bun.lock bun.lockb && npx nx release publish
