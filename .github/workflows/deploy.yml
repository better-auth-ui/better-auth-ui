name: Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CF_SEND_TELEMETRY: "false"
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_PARALLEL: "1"
  NX_TUI: "false"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build docs
        run: bun nx build docs --outputStyle=stream

      - name: Package for Cloudflare
        working-directory: apps/docs
        run: bun run build:cloudflare

      - name: Validate Cloudflare artifact
        working-directory: apps/docs
        run: bunx cf deploy --prebuilt --dry-run

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt

      - name: Upload a preview version
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf workers versions create --prebuilt

  heroui-example:
    name: HeroUI example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build example
        run: bun nx build start-heroui-example --outputStyle=stream

      - name: Validate Cloudflare artifact
        working-directory: examples/start-heroui-example
        run: bunx cf deploy --prebuilt --dry-run

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: examples/start-heroui-example
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt

      - name: Upload a preview version
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: examples/start-heroui-example
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf workers versions create --prebuilt
