name: Release and Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'better-auth-ui/better-auth-ui' &&
      github.ref == 'refs/heads/main'
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
