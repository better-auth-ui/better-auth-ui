name: 🐞 Bug report
description: Report a reproducible problem with Better Auth UI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Better Auth UI. For setup help and usage questions, please use our [Discord community](https://discord.gg/GKPC4npz8K).

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Is there an existing issue for this?
      description: Search the open and closed issues before filing a new report.
      options:
        - label: I have searched the existing issues.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the package or part of the project where the problem occurs.
      options:
        - "@better-auth-ui/core"
        - "@better-auth-ui/react"
        - "@better-auth-ui/heroui"
        - "@better-auth-ui/solid"
        - shadcn registry
        - Documentation or website
        - Other
    validations:
      required: true

  - type: dropdown
    id: style
    attributes:
      label: UI library or style
      description: Select the UI implementation used by your project.
      options:
        - shadcn/ui with Radix UI
        - shadcn/ui with Base UI
        - HeroUI
        - Zaidan for SolidJS
        - Not applicable
        - Other
    validations:
      required: true

  - type: input
    id: better-auth-ui-version
    attributes:
      label: Better Auth UI version
      description: Provide the installed package version or registry item version.
      placeholder: "1.6.40"
    validations:
      required: true

  - type: input
    id: better-auth-version
    attributes:
      label: Better Auth version
      description: Provide the installed Better Auth version, if applicable.
      placeholder: "1.6.19"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what happened and how it affects your application.
      placeholder: Tell us what you observed.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that consistently reproduces the problem.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: reproduction-link
    attributes:
      label: Reproduction link
      description: Link to a minimal repository or sandbox when possible.
      placeholder: https://github.com/username/reproduction

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your framework, runtime, browser, and operating system.
      placeholder: |
        Framework: Next.js 16
        Runtime: Bun 1.3
        Browser: Firefox 147
        Operating system: macOS 26
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant logs, screenshots, configuration, or other details. Remove secrets before posting.
